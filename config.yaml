version: 6.0.0

# Interface mode: 'gui' or 'cli'
interface_mode: cli

# Active plugins to load at startup
active_plugins:
  - color_mood_mapper
  - bug_buster
  - sql_sorcerer
  - prompt_checker

# RAG pipeline configuration
rag:
  docs_path: "docs/data/"
  model: "gpt-3.5-turbo"
  k: 3

# Memory persistence configuration
memory:
  enabled: true
  path: "memory.json"

# Cloud sync configuration
sync:
  enabled: false
  service: "github"

# Telemetry configuration
telemetry:
  enabled: false
  mode: "local"

# OpenRouter API configuration
openrouter_api_key: "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"

# Subconscious agent configuration
subconscious:
  enabled: true
  dream_interval: 3600 # seconds between "dream" cycles
